name: Deploy to Pages

# Builds the Rithmic terminal and publishes dist/ to GitHub Pages. Each visitor
# signs in with their own Rithmic credentials; none are baked into the build.
#
# One-time setup in the repository settings:
# - Settings → Pages → Source: GitHub Actions.
# - Settings → Environments → github-pages → Deployment branches: allow every
#   branch listed under `push` below (by default only the default branch may deploy).
# - Optional variables, on the github-pages environment or the repository:
#   VITE_RITHMIC_GATEWAY and VITE_RITHMIC_SYSTEM_NAME (default here: Chicago and
#   "Rithmic Paper Trading"), VITE_RITHMIC_APP_NAME, VITE_RITHMIC_APP_VERSION,
#   VITE_RITHMIC_PRODUCTS. The app name and version may also be secrets.
#   Unset ones fall back to the defaults in src/rithmic/config.ts
#   ("OpenCharts", ES/MES/NQ/MNQ). Production systems (prop firms) only accept
#   an app name approved in Rithmic conformance on the order plant.

on:
  push:
    branches: [main, feat/rithmic-broker]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exposes the github-pages environment's variables and secrets to the build.
    environment:
      name: github-pages
    env:
      RITHMIC_APP_NAME: ${{ vars.VITE_RITHMIC_APP_NAME || secrets.VITE_RITHMIC_APP_NAME }}
      RITHMIC_APP_VERSION: ${{ vars.VITE_RITHMIC_APP_VERSION || secrets.VITE_RITHMIC_APP_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Values stored as secrets show as *** here, which still confirms they are set.
      - name: Show Rithmic app identity
        run: |
          echo "App name:    ${RITHMIC_APP_NAME:-(unset, default OpenCharts)}"
          echo "App version: ${RITHMIC_APP_VERSION:-(unset, default 0.3.0)}"

      # BASE_PATH makes asset URLs resolve under /<repo>/ on project Pages.
      # VITE_ADAPTER=rithmic also lets the CSP reach wss://*.rithmic.com.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ADAPTER: rithmic
          VITE_RITHMIC_GATEWAY: ${{ vars.VITE_RITHMIC_GATEWAY || 'wss://rprotocol-mobile.rithmic.com:443' }}
          VITE_RITHMIC_APP_NAME: ${{ env.RITHMIC_APP_NAME }}
          VITE_RITHMIC_APP_VERSION: ${{ env.RITHMIC_APP_VERSION }}
          VITE_RITHMIC_PRODUCTS: ${{ vars.VITE_RITHMIC_PRODUCTS }}
          VITE_RITHMIC_SYSTEM_NAME: ${{ vars.VITE_RITHMIC_SYSTEM_NAME || 'Rithmic Paper Trading' }}

      # The app reads import.meta.env as a whole, which makes Vite inline every
      # VITE_* variable. Refuse to publish if login credentials ever got in.
      - name: Check no credentials in the bundle
        run: |
          if grep -rlE "VITE_RITHMIC_(USER|PASSWORD)" dist/; then
            echo "::error::Rithmic credentials found in dist/; refusing to publish."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
